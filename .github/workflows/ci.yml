name: Test and build
on:
  pull_request:
  push:
    branches: [dev, main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.9', '3.13', '3.14']
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python build.py --python-version ${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        with:
          name: AfterDownloads-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.egg
